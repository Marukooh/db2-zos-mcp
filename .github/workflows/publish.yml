name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance, no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --access public
